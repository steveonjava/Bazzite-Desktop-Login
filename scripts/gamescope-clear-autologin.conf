# Installed by Bazzite-Desktop-Login to
#   /etc/systemd/user/gamescope-session-plus@.service.d/10-clear-autologin.conf
#
# Disarms the temporary autologin as soon as game mode is actually up, making it
# one-shot. Applied to the TEMPLATE unit (@.service) rather than a single instance,
# so it covers @ogui-steam, @steam and any other client name.
#
# Autologin is cleared at both ends of the session. ExecStartPost is the normal path;
# ExecStopPost is the backstop if the first clear failed. Disarming is idempotent, so
# running it twice is harmless.
#
# Bazzite can reuse the same user systemd manager when moving from Gamescope back to
# Plasma. Stop the portal broker synchronously during teardown so the next desktop
# session activates a fresh broker with its KDE environment and backend. Portal cleanup
# is best-effort because shutdown or a closing user bus must not mark Gamescope failed.
[Service]
ExecStartPost=/usr/bin/sudo -n /usr/local/bin/bazzite-clear-autologin.sh
ExecStopPost=-/usr/bin/systemctl --user stop xdg-desktop-portal.service
ExecStopPost=/usr/bin/sudo -n /usr/local/bin/bazzite-clear-autologin.sh
